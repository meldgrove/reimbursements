# Production on a Linux server (Debian 13, Ubuntu 24.04) with Docker Compose: web,
# worker, ClamAV, migrations and the updater, behind Caddy on the same server
# (docs/deployment.md). Settings live in .env next to this file
# (.env.production.example); start it with:
#
#   docker compose up -d --pull always
#
# PostgreSQL runs separately (a server of your own), or next to the app with
# compose.postgres.yaml (COMPOSE_FILE=compose.yaml:compose.postgres.yaml in .env).
# The release image. REIMBURSEMENTS_VERSION names a version such as 0.3.1 or a series
# such as 0.3 (docs/updates.md). With automatic updates, the server writes the exact
# version it installs there. The branch `stable` is at the newest release. On Coolify,
# use compose.coolify.yaml (docs/coolify.md). Local development uses compose.dev.yaml.
x-image: &image ghcr.io/meldgrove/reimbursements:${REIMBURSEMENTS_VERSION:?Set the release series, e.g. 0.3}

x-application: &application
  image: *image
  restart: unless-stopped
  pids_limit: 64
  mem_limit: 512m
  environment:
    DJANGO_DEBUG: "0"
    DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a random secret of at least 50 characters}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Include the public hostname and 127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set the public HTTPS origin}
    DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL URL}
    PRIVATE_STORAGE_ROOT: /app/var/private
    TRUST_PROXY_HEADERS: "1"
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set the networks used by the trusted reverse proxy}
    DOCUMENT_SANDBOX_ENABLED: "1"
    REQUIRE_WORKER_HEARTBEAT: "1"
    HEALTHCHECK_TOKEN: ${HEALTHCHECK_TOKEN:?Set a random health check token}
    PORTAL_OPERATOR: ${PORTAL_OPERATOR:-}
    PORTAL_LEGAL_URL: ${PORTAL_LEGAL_URL:-}
    KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:?Set the identity provider HTTPS URL}
    KEYCLOAK_REALM: ${KEYCLOAK_REALM:?Set the identity provider realm}
    # Email is set up under Admin > Email; values set here win over it.
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    MAIL_REPLY_TO_ADDRESS: ${MAIL_REPLY_TO_ADDRESS:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the Keycloak client ID}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the Keycloak client secret}
    KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP:-/reimbursements/admins}
    KEYCLOAK_EDITOR_GROUP: ${KEYCLOAK_EDITOR_GROUP:-/reimbursements/editors}
    MAIL_DELIVERY_MODE: send
    MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:-}
    MAILERSEND_WEBHOOK_SIGNING_SECRET: ${MAILERSEND_WEBHOOK_SIGNING_SECRET:-}
    APPROVED_DELIVERY_RECIPIENTS: ${APPROVED_DELIVERY_RECIPIENTS:?Set the approved accounting inboxes}
    TEST_RECIPIENT_ALLOWLIST: ${TEST_RECIPIENT_ALLOWLIST:-}
    UPLOAD_SCANNER: clamav
    CLAMAV_HOST: scanner
    CLAMAV_PORT: "3310"
    MAX_ACTIVE_DRAFTS: ${MAX_ACTIVE_DRAFTS:-10000}
    TOTAL_WEB_WORKERS: ${TOTAL_WEB_WORKERS:-2}
    MAX_DRAFTS_PER_NETWORK: ${MAX_DRAFTS_PER_NETWORK:-300}
    MAX_UPLOADS_PER_NETWORK: ${MAX_UPLOADS_PER_NETWORK:-5000}
    MAX_UPLOADS_PER_NETWORK_PER_MINUTE: ${MAX_UPLOADS_PER_NETWORK_PER_MINUTE:-1000}
    MAX_UPLOAD_BYTES_PER_NETWORK: ${MAX_UPLOAD_BYTES_PER_NETWORK:-15000000000}
    MAX_PENDING_VALIDATIONS: ${MAX_PENDING_VALIDATIONS:-1000}
    MAX_JOB_AGE_SECONDS: ${MAX_JOB_AGE_SECONDS:-900}
    MAX_FINAL_PDF_BYTES: ${MAX_FINAL_PDF_BYTES:-10000000}
    MIN_FREE_STORAGE_BYTES: ${MIN_FREE_STORAGE_BYTES:-1000000000}
    JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-240}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    # The updater's API for the admins' update button. An empty value falls back to the
    # default here, so it cannot switch the button off.
    UPDATER_URL: ${UPDATER_URL:-http://updater:8080}
  volumes:
    - private_data:/app/var/private
  tmpfs:
    - /app/var/private/work:size=700m,mode=0700,uid=10001,gid=10001

x-dependencies: &dependencies
  scanner:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  # One-time job before web and worker start.
  migrate:
    <<: *application
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *application
    # Only on the server itself, for Caddy. REIMBURSEMENTS_PORT picks another host port
    # when 8000 is taken, e.g. by another app. Each sync gunicorn worker serves one
    # request at a time, so Caddy receives the whole request first and forwards it at
    # once (docs/deployment.md).
    ports:
      - "127.0.0.1:${REIMBURSEMENTS_PORT:-8000}:8000"
    depends_on: *dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/-/readyz',headers={'X-Health-Token':os.environ['HEALTHCHECK_TOKEN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      start_period: 60s
      timeout: 5s
      retries: 3

  worker:
    <<: *application
    command: ["python", "manage.py", "run_jobs"]
    mem_limit: 2g
    cpus: 2
    depends_on: *dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert 0 <= time.time()-Path('/app/var/private/worker-heartbeat').stat().st_mtime < 420"]
      interval: 60s
      start_period: 60s
      timeout: 5s
      retries: 3

  scanner:
    image: clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    volumes:
      - scanner_data:/var/lib/clamav
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      start_period: 180s
      timeout: 10s
      retries: 5

  # Automatic updates and the admins' update button (docs/updates.md). It checks for new
  # versions always, and installs them once the server runs `updater host-setup`: the
  # server then sets REIMBURSEMENTS_VERSION to the version, pulls it, runs
  # `docker compose up --wait`, and rolls back if it fails. Its API on port 8080 has no
  # authentication: never publish the port.
  updater:
    image: ghcr.io/meldgrove/updater:0.2
    restart: unless-stopped
    mem_limit: 64m
    environment:
      IMAGE: *image
      VERSION_VARIABLE: REIMBURSEMENTS_VERSION
      # A release installs once it has been out this long, and only inside the window,
      # if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
    volumes:
      - updater:/trigger

  # Backups for Meldgrove Backups (docs/deployment.md#backups): the database and
  # the `private_data` volume, sent when Backups asks. Idle while BACKUP_URL is
  # empty; it only reads and opens no port.
  backup-agent:
    image: ghcr.io/meldgrove/backup-agent:0.1
    restart: unless-stopped
    # The app's user, so that the agent reads every file the app writes.
    user: "10001:10001"
    environment:
      # From the app's source in Meldgrove Backups. Empty: the agent idles.
      BACKUP_URL: ${BACKUP_URL:-}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL URL}
      APP_NAME: reimbursements
      APP_IMAGE: *image
      # Settings a restore needs that are not in the backup (names only).
      APP_SECRETS: DJANGO_SECRET_KEY
    volumes:
      - private_data:/data/private_data:ro

volumes:
  private_data:
  scanner_data:
  updater:
