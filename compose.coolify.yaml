# The whole application as one Coolify resource: web, worker, ClamAV and migrations.
# PostgreSQL is a separate Coolify resource; start it before deploying this stack.
# Enable Connect To Predefined Network to reach its internal DATABASE_URL.
x-application: &application
  build:
    context: .
    target: runtime
  restart: unless-stopped
  pids_limit: 64
  mem_limit: 512m
  environment:
    DJANGO_DEBUG: "0"
    DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a random secret of at least 50 characters}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Include the public hostname and 127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set the public HTTPS origin}
    DATABASE_URL: ${DATABASE_URL:?Use the separate PostgreSQL resource internal URL}
    PRIVATE_STORAGE_ROOT: /app/var/private
    TRUST_PROXY_HEADERS: "1"
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set the networks used by the trusted reverse proxy}
    DOCUMENT_SANDBOX_ENABLED: "1"
    REQUIRE_WORKER_HEARTBEAT: "1"
    HEALTHCHECK_TOKEN: ${HEALTHCHECK_TOKEN:?Set a random health check token}
    PORTAL_NAME: ${PORTAL_NAME:-Erstattungsportal}
    PORTAL_OPERATOR: ${PORTAL_OPERATOR:-}
    PORTAL_LEGAL_URL: ${PORTAL_LEGAL_URL:-}
    KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:?Set the identity provider HTTPS URL}
    KEYCLOAK_REALM: ${KEYCLOAK_REALM:?Set the identity provider realm}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set the verified sender address}
    MAIL_REPLY_TO_ADDRESS: ${MAIL_REPLY_TO_ADDRESS:?Set the reply address}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the Keycloak client ID}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the Keycloak client secret}
    KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP:-/reimbursements/admins}
    KEYCLOAK_EDITOR_GROUP: ${KEYCLOAK_EDITOR_GROUP:-/reimbursements/editors}
    MAIL_DELIVERY_MODE: mailersend
    MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:?Set the MailerSend API token}
    MAILERSEND_WEBHOOK_SIGNING_SECRET: ${MAILERSEND_WEBHOOK_SIGNING_SECRET:?Set the webhook signing secret}
    APPROVED_DELIVERY_RECIPIENTS: ${APPROVED_DELIVERY_RECIPIENTS:?Set the approved accounting inboxes}
    TEST_RECIPIENT_ALLOWLIST: ${TEST_RECIPIENT_ALLOWLIST:-}
    UPLOAD_SCANNER: clamav
    CLAMAV_HOST: scanner
    CLAMAV_PORT: "3310"
    MAX_ACTIVE_DRAFTS: ${MAX_ACTIVE_DRAFTS:-10000}
    TOTAL_WEB_WORKERS: ${TOTAL_WEB_WORKERS:-2}
    MAX_DRAFTS_PER_NETWORK: ${MAX_DRAFTS_PER_NETWORK:-300}
    MAX_UPLOADS_PER_NETWORK: ${MAX_UPLOADS_PER_NETWORK:-5000}
    MAX_UPLOADS_PER_NETWORK_PER_MINUTE: ${MAX_UPLOADS_PER_NETWORK_PER_MINUTE:-1000}
    MAX_UPLOAD_BYTES_PER_NETWORK: ${MAX_UPLOAD_BYTES_PER_NETWORK:-15000000000}
    MAX_PENDING_VALIDATIONS: ${MAX_PENDING_VALIDATIONS:-1000}
    MAX_JOB_AGE_SECONDS: ${MAX_JOB_AGE_SECONDS:-900}
    MAX_FINAL_PDF_BYTES: ${MAX_FINAL_PDF_BYTES:-10000000}
    MIN_FREE_STORAGE_BYTES: ${MIN_FREE_STORAGE_BYTES:-1000000000}
    JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-240}
  volumes:
    - private_data:/app/var/private
  tmpfs:
    - /app/var/private/work:size=700m,mode=0700,uid=10001,gid=10001

x-dependencies: &dependencies
  scanner:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  # Coolify removes this extension before passing the definition to Docker.
  # Exclude the successfully exited one-time container from application health.
  migrate:
    <<: *application
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    exclude_from_hc: true

  web:
    <<: *application
    expose:
      - "8000"
    # Each sync gunicorn worker serves one request at a time, so a slowly sent request
    # would hold it. Traefik receives the whole request first and forwards it at once.
    # Coolify attaches middlewares defined here to the routers it generates for `web`.
    # The limit stays above the upload cap, so the app still answers oversized uploads.
    labels:
      - traefik.http.middlewares.reimbursement-portal-buffering.buffering.maxRequestBodyBytes=10485760
    depends_on: *dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/-/readyz',headers={'X-Health-Token':os.environ['HEALTHCHECK_TOKEN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      start_period: 60s
      timeout: 5s
      retries: 3

  worker:
    <<: *application
    command: ["python", "manage.py", "run_jobs"]
    mem_limit: 2g
    cpus: 2
    depends_on: *dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert 0 <= time.time()-Path('/app/var/private/worker-heartbeat').stat().st_mtime < 420"]
      interval: 60s
      start_period: 60s
      timeout: 5s
      retries: 3

  scanner:
    image: clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    volumes:
      - scanner_data:/var/lib/clamav
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      start_period: 180s
      timeout: 10s
      retries: 5

volumes:
  private_data:
  scanner_data:
