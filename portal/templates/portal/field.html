<div class="field{% if wide %} sm:col-span-2{% endif %}"{% if field_id %} id="{{ field_id }}"{% endif %}><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required or required %} <span class="required-mark" aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% if hint %}<small>{{ hint }}</small>{% endif %}<p class="field-error" id="error-{{ field.name }}" aria-live="polite"></p></div>
