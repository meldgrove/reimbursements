# Version updates: npm at the root every weekday, the rest weekly. A release
# is proposed once it has been out for seven days, except @meldgrove/*;
# security updates ignore the schedule and the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Images are pinned by digest; these updates keep the digests current and reviewed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A new Node.js major goes together with engines in package.json.
      - dependency-name: node
        update-types:
          - version-update:semver-major
  # compose.yaml, compose.coolify.yaml, compose.postgres.yaml and compose.dev.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A new PostgreSQL major version needs a data migration.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
  # The npm workspaces (package.json, apps/*, packages/*). Meldgrove's own
  # packages (@meldgrove/ui) come at once, in a pull request of their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: ["@meldgrove/*"]
    groups:
      meldgrove-ui:
        patterns: ["@meldgrove/*"]
      npm-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@meldgrove/*"]
        update-types: [minor, patch]
  # Playwright for the browser checks.
  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
