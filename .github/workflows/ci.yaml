name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and production image
    # The document sandbox tests require Linux with Landlock ABI 3 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: compose.ci.yaml
      COMPOSE_PROJECT_NAME: reimbursements-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public repository contents
        run: python3 scripts/check_public_repository.py

      - name: Check signature lifecycle
        run: node --test tests/js/*.test.cjs

      - name: Build test image
        run: docker compose --env-file /dev/null build checks

      - name: Run lint, Django checks, and PostgreSQL tests
        run: docker compose --env-file /dev/null run --rm --no-TTY checks

      - name: Build production image and stylesheet
        run: docker build --target runtime --tag reimbursements:ci .

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans
