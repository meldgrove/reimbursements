name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and production image
    # The document sandbox tests require Linux with Landlock ABI 3 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: compose.ci.yaml
      COMPOSE_PROJECT_NAME: reimbursements-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public repository contents
        run: python3 scripts/check_public_repository.py

      - name: Check signature lifecycle
        run: node --test tests/js/*.test.cjs

      - name: Build test image
        run: docker compose --env-file /dev/null build checks

      - name: Run lint, Django checks, and PostgreSQL tests
        run: docker compose --env-file /dev/null run --rm --no-TTY checks

      - name: Build production image and stylesheet
        run: docker build --target runtime --tag reimbursements:ci .

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans

  browser:
    name: Browser and setup checks
    # The production image's document sandbox requires Linux with Landlock ABI 3 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: compose.ci.yaml
      COMPOSE_PROJECT_NAME: reimbursements-browser-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Playwright and Chromium
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build production image
        run: docker compose --env-file /dev/null build web

      - name: Migrate and create the demo form
        run: |
          docker compose --env-file /dev/null run --rm --no-TTY web python manage.py migrate --noinput
          docker compose --env-file /dev/null run --rm --no-TTY web python manage.py seed_demo

      - name: Start web and worker
        run: docker compose --env-file /dev/null up --detach --wait web worker

      - name: Run participant smoke test
        env:
          BASE_URL: http://127.0.0.1:8000
          OUTPUT_DIR: ${{ runner.temp }}/browser
        run: node tests/browser/smoke.cjs

      - name: Run setup check
        run: >-
          docker compose --env-file /dev/null exec --no-TTY web
          python manage.py verify_setup --to finance@example.invalid

      - name: Keep screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/browser/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans
