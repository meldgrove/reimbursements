name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"

jobs:
  checks:
    # The ruleset of main requires this check by name: rename both together.
    name: Checks and production image
    # The document sandbox needs Linux with Landlock ABI 3 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Where the PostgreSQL service and the production image listen.
      POSTGRES_URL: postgresql://reimbursement:reimbursement@localhost:5432
      WEB_PORT: "8000"
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_DB: reimbursement
          POSTGRES_USER: reimbursement
          POSTGRES_PASSWORD: reimbursement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reimbursement" --health-interval 5s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check public repository contents
        run: node scripts/check-public-repository.mjs

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Unit tests
        run: npm test

      - name: Migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            git status --porcelain apps/server/drizzle
            echo "The schema in apps/server/src/db/schema.ts has changes without a migration. Run: npm run db:generate"
            exit 1
          fi

      - name: Integration tests on PostgreSQL
        run: TEST_DATABASE_URL="$POSTGRES_URL/reimbursements_test" npm run test:integration

      - run: npm run build
      # What the image installs (Dockerfile, prod-deps).
      - run: npm audit --omit=dev --audit-level=high

      - name: Build production image
        run: docker build --tag reimbursements:ci .

      - name: The image runs as the user of the Django version
        run: test "$(docker run --rm --entrypoint id reimbursements:ci -u)" = "10001"

      # Production settings: the image refuses to start without its secrets and
      # names them, migrates an empty database, serves the sign-in page through
      # the proxy (plain HTTP is redirected to HTTPS, as Caddy's requests are
      # not), and its document sandbox passes its self-test (Landlock and seccomp
      # on this runner's kernel) at startup and in /-/readyz.
      - name: Start the production image
        run: |
          if output=$(docker run --rm --network host reimbursements:ci migrate 2>&1); then
            echo "The image started without its settings"
            exit 1
          fi
          echo "$output"
          grep -q "Invalid configuration" <<< "$output"
          grep -q "AUTH_SECRET" <<< "$output"
          workspace=(--tmpfs "/app/var/private/work:size=700m,mode=0700,uid=10001,gid=10001")
          env_args=(
            -e PORT="$WEB_PORT"
            -e DATABASE_URL="$POSTGRES_URL/reimbursement"
            -e APP_URL=https://reimbursements.example.invalid
            -e AUTH_SECRET=ci-only-secret-ci-only-secret-ci-only-secret-ci-only
            -e TRUST_PROXY_HEADERS=1 -e "TRUSTED_PROXY_CIDRS=127.0.0.1/32,::1/128"
            -e KEYCLOAK_BASE_URL=https://sso.example.invalid -e KEYCLOAK_REALM=reimbursements
            -e OIDC_CLIENT_ID=reimbursements -e OIDC_CLIENT_SECRET=ci
            -e HEALTHCHECK_TOKEN=ci-token
            -e MAILERSEND_API_TOKEN=ci -e MAILERSEND_WEBHOOK_SIGNING_SECRET=ci
            -e APPROVED_DELIVERY_RECIPIENTS=finance@example.invalid
            -e MAIL_FROM_ADDRESS=no-reply@example.invalid -e MAIL_REPLY_TO_ADDRESS=finance@example.invalid
          )
          # The document workspace as compose.yaml mounts it: a private tmpfs. Without
          # it (or without the sandbox) migrate, web and worker refuse to start.
          docker run --rm --network host "${env_args[@]}" "${workspace[@]}" reimbursements:ci migrate
          # The operator command through the image's `cli` on the PATH: the migration
          # copied the email variables above into Admin > Email once.
          docker run --rm --network host "${env_args[@]}" --entrypoint cli reimbursements:ci settings list \
            | tee "$RUNNER_TEMP/settings.txt"
          grep -q '^email  *set  *MailerSend, sender set, reply address set' "$RUNNER_TEMP/settings.txt"
          docker run -d --name web --network host "${env_args[@]}" "${workspace[@]}" reimbursements:ci web
          for _ in $(seq 1 30); do
            curl -fsS -H "X-Health-Token: ci-token" "http://localhost:$WEB_PORT/-/healthz" && break
            sleep 1
          done
          proxied=(-H "X-Forwarded-Proto: https")
          test "$(curl -s -o /dev/null -w '%{redirect_url}' "http://localhost:$WEB_PORT/admin/login")" = \
            https://reimbursements.example.invalid/admin/login
          curl -fsS "${proxied[@]}" -H "accept: text/html" "http://localhost:$WEB_PORT/admin/login" | grep -q '<div id="root">'
          curl -fsS "${proxied[@]}" "http://localhost:$WEB_PORT/api/v1/meta" | grep -q '"user":null'
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$WEB_PORT/-/healthz")" = "404"
          # Not ready as a whole (no ClamAV, no worker here), but the sandbox
          # and the workspace pass.
          curl -sS -H "X-Health-Token: ci-token" "http://localhost:$WEB_PORT/-/readyz" | tee "$RUNNER_TEMP/readyz.json"
          echo
          jq -e '.checks.sandbox == true and .checks.workspace == true' "$RUNNER_TEMP/readyz.json"

      # The updater installs images, not files: a server of 0.4 starts the
      # image with the Django compose.yaml, and may go back to 0.4.
      - name: Upgrade from 0.4 with its compose file, and back
        run: tests/upgrade/django-compose.sh reimbursements:ci

      - name: Show logs on failure
        if: failure()
        run: docker logs web || true

  browser:
    # The ruleset of main requires this check by name: rename both together.
    name: Browser and setup checks
    # The production image's document sandbox needs Linux with Landlock ABI 3 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The address of the app; the development Keycloak (dev/keycloak) allows
      # http://localhost:8000/oidc/callback/ as its redirect.
      WEB_PORT: "8000"
      DEV_POSTGRES_URL: postgresql://reimbursement:reimbursement@localhost:55468/reimbursement
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The runner's temporary folder is known only to steps, not to the job's env.
      - name: Folders for screenshots, upload files and the admin session
        run: |
          {
            echo "OUTPUT_DIR=$RUNNER_TEMP/browser"
            echo "FIXTURES_DIR=$RUNNER_TEMP/fixtures"
            echo "ADMIN_STORAGE_STATE=$RUNNER_TEMP/admin-session.json"
          } >> "$GITHUB_ENV"

      - name: Install Playwright and Chromium
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start PostgreSQL and Keycloak
        run: docker compose -f compose.dev.yaml up --detach --wait database keycloak

      - name: Build production image
        run: docker build --tag reimbursements:ci .

      # The production image in development mode, which allows local email and
      # no scanner; the sandbox and the worker heartbeat are on as in production.
      - name: Migrate and start web and worker
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          sudo chown 10001:10001 "$RUNNER_TEMP/private"
          sudo chmod 0700 "$RUNNER_TEMP/private"
          env_args=(
            -e PORT="$WEB_PORT"
            -e DEPLOYMENT_ENV=development
            -e DATABASE_URL="$DEV_POSTGRES_URL"
            -e APP_URL="http://localhost:$WEB_PORT"
            -e KEYCLOAK_BASE_URL=http://localhost:8106 -e KEYCLOAK_REALM=reimbursements
            -e OIDC_CLIENT_ID=reimbursements -e OIDC_CLIENT_SECRET=reimbursements-dev-client-secret
            -e MAIL_DELIVERY_MODE=local -e UPLOAD_SCANNER=disabled
            -e DOCUMENT_SANDBOX_ENABLED=1 -e REQUIRE_WORKER_HEARTBEAT=1
            -e UPDATER_URL=
            -v "$RUNNER_TEMP/private:/app/var/private"
            --tmpfs "/app/var/private/work:size=700m,mode=0700,uid=10001,gid=10001"
          )
          docker run --rm --network host "${env_args[@]}" reimbursements:ci migrate
          docker run -d --name web --network host "${env_args[@]}" reimbursements:ci web
          docker run -d --name worker --network host "${env_args[@]}" reimbursements:ci worker
          for _ in $(seq 1 30); do curl -fsS "http://localhost:$WEB_PORT/-/healthz" && break; sleep 1; done
          echo
          docker exec web docker-entrypoint.sh cli seed-demo

      - name: Draw the synthetic upload files
        run: node tests/browser/fixtures.cjs "$FIXTURES_DIR"

      - name: Participant checks
        env:
          BASE_URL: http://localhost:${{ env.WEB_PORT }}
        run: |
          for check in smoke live-validation receipt-removal signature-recovery error-recovery; do
            echo "::group::$check"
            node "tests/browser/$check.cjs"
            echo "::endgroup::"
          done

      - name: Admin checks, signed in through Keycloak
        env:
          BASE_URL: http://localhost:${{ env.WEB_PORT }}
        run: |
          node tests/browser/sign-in.cjs
          node tests/browser/admin-form-recovery.cjs

      - name: Setup check
        run: docker exec web docker-entrypoint.sh cli verify-setup --to finance@example.invalid

      - name: Keep screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/browser/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs web || true
          docker logs worker || true

  # The updater installs images, not files: each new image must start with the
  # compose files of the newest release (branch stable), as servers have them.
  # ClamAV gets a stand-in; the real one loads its signatures for minutes.
  compose-compat:
    name: Compose files of the newest release
    permissions:
      contents: read
    uses: meldgrove/.github/.github/workflows/compose-compat.yml@401e2112820727724d7143307850eaeceac6d5f0 # v1.2.0
    with:
      version_variable: REIMBURSEMENTS_VERSION
      env_file: .github/compose-compat.env
      extra_compose_files: .github/compose-compat.fakes.yaml
