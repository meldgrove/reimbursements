# Publishes each commit on main that passed CI as a preview
# (X.Y.Z-preview.N and the tag preview), for installations on the Preview
# update channel. The jobs are the release workflow that every Meldgrove
# repository shares (https://github.com/meldgrove/.github#previews); this
# file holds the trigger and this repository's values, as release.yml does.

name: Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    # Pushes to main only; CI also runs for pull requests.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # One preview at a time; each publishes the newest commit that passed CI.
    # On the job, not the workflow: a failed CI run, which skips the job,
    # must not replace a waiting preview.
    concurrency:
      group: preview
      cancel-in-progress: false
    permissions:
      actions: read # find the CI run of the commit
      contents: write # requested by the shared jobs; a preview pushes nothing
      pull-requests: read
      packages: write # push the image
      id-token: write # sign the attestation
      attestations: write
      artifact-metadata: write
    uses: meldgrove/.github/.github/workflows/release.yml@be24d5a706d2e266492e3e910a23cde3d04aef36 # v1.2.1
    with:
      preview: true
      revision: ${{ github.event.workflow_run.head_sha }}
      image: ghcr.io/meldgrove/reimbursements
      target: runtime
      ci_workflow: ci.yaml
      upgrade_doc: docs/deployment.md
      title: Meldgrove Reimbursement
      description: Self-hosted reimbursement forms, receipt processing, and email delivery.
      license: Apache-2.0
