# Local development: PostgreSQL, a Keycloak with a ready realm, and (optionally) ClamAV.
# The app runs on the host (docs/development.md):
#   docker compose -f compose.dev.yaml up -d
#   cp .env.example .env && npm ci && npm run db:migrate && npm run dev
# Keycloak: http://localhost:8106 (admin/admin; realm "reimbursements",
#   admin@example.invalid / admin is a template admin, editor@example.invalid / editor a form editor)
# ClamAV:   docker compose -f compose.dev.yaml --profile scanner up -d (UPLOAD_SCANNER=clamav, CLAMAV_HOST=127.0.0.1)
name: reimbursements-dev

services:
  database:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_DB: reimbursement
      POSTGRES_USER: reimbursement
      POSTGRES_PASSWORD: reimbursement
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-55468}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reimbursement -d reimbursement"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-3
    command: ["start-dev", "--import-realm", "--http-port=8106"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The image sizes the heap from host RAM (up to 70 %); cap it for local use.
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"
      KC_HOSTNAME: http://localhost:8106
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8106:8106"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      retries: 60

  scanner:
    profiles: [scanner]
    image: clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    ports:
      - "127.0.0.1:${DEV_CLAMAV_PORT:-3310}:3310"
    volumes:
      - scanner_data:/var/lib/clamav
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      start_period: 180s
      timeout: 10s
      retries: 5

volumes:
  database_data:
  scanner_data:
